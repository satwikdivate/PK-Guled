# Included in every location (nginx drops inherited add_header when a location adds its own).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# Generated at build time with hashes of Angular's inline scripts (scripts/build-sitemap.mjs).
include /etc/nginx/snippets/csp.conf;
