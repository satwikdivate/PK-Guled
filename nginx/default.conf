# P K Guled static site. Every route is a prerendered HTML file, so there is no SPA
# fallback to index.html: unknown URLs get /404.html with a real 404 status.

server_tokens off;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 512;
gzip_types text/plain text/css text/xml application/xml application/javascript text/javascript
           application/json application/ld+json image/svg+xml application/manifest+json;
# Brotli is not compiled into the stock nginx image. If you put Caddy or a CDN in front,
# enable brotli there.

# Public scheme for the WhatsApp preview pages: https when a proxy (Caddy) says so.
map $http_x_forwarded_proto $public_scheme {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    # IPv4 only: an IPv6 listen line stops nginx on hosts where IPv6 is disabled.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Redirects keep the port and host the visitor used (works behind a proxy or on IP:port).
    absolute_redirect off;

    error_page 404 /404.html;

    # Prerendered pages: /collections/khun-materials -> /collections/khun-materials/index.html
    location / {
        try_files $uri $uri/index.html $uri.html =404;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/headers.conf;
    }

    # WhatsApp preview pages (/p/<CODE>). Their og:image needs an absolute URL, so the
    # __ORIGIN__ placeholder is replaced with the address the link was opened on
    # (VM IP:port today, the real domain later) without rebuilding.
    location /p/ {
        try_files $uri $uri/index.html =404;
        sub_filter_types text/html;
        sub_filter_once off;
        sub_filter "__ORIGIN__" "$public_scheme://$http_host";
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/headers.conf;
    }

    # Content JSON must update right after a redeploy.
    location /assets/data/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/headers.conf;
    }

    # Product and site images (file names are stable saree codes; rebuild changes the image tag).
    location /img/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/headers.conf;
    }

    # Hashed build output (main-XXXX.js, chunk-XXXX.js, styles-XXXX.css, media/*.woff2).
    # The regex must be quoted because it contains { } (otherwise nginx fails to start).
    location ~* "^/(?:.+-[A-Z0-9]{8}\.(?:js|css)|media/.+\.woff2?)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/headers.conf;
    }

    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/headers.conf;
    }

    # Never serve the client-side fallback shell directly.
    location = /index.csr.html {
        return 404;
    }
}
